version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: juniorconnect_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: juniorconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: juniorconnect_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/juniorconnect
      JWT_ACCESS_SECRET: production_access_secret_change_me_12345
      JWT_REFRESH_SECRET: production_refresh_secret_change_me_12345
      CORS_ORIGIN: http://localhost,http://localhost:80,http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: juniorconnect_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
