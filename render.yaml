# Render 1-Click Combined Deployment Blueprint (Backend + PostgreSQL Database Together)
services:
  - type: web
    name: juniorconnect-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: juniorconnect-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: juniorconnect-db
    databaseName: juniorconnect
